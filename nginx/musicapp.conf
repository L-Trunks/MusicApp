# ============================================================
#  MusicApp — Nginx 反向代理配置
#  将本文件复制到 /etc/nginx/sites-available/musicapp
#  并软链接到 /etc/nginx/sites-enabled/musicapp
#
#  域名替换示例：
#    - 使用 music.chrisers.cc：sudo sed -i 's/music\.yourdomain\.com/music.chrisers.cc/g' /etc/nginx/sites-available/musicapp
#    - 使用其他域名：将 music.yourdomain.com 全部替换为你的域名（如 music.你的域名.com）
# ============================================================

# 前端 (Next.js)
upstream musicapp_front {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 后端 API (Express)
upstream musicapp_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── HTTP → HTTPS 跳转 ────────────────────────────────────────────────────────
# 如果 80 端口已被其他 server block 占用，
# 仅需在那个 block 里追加下面这段 location，而不是新建整个 server 块：
#
#   location /.well-known/acme-challenge/ {
#       root /var/www/letsencrypt;
#   }
#   location / {
#       return 301 https://music.yourdomain.com$request_uri;
#   }
#
# 若 80 端口空闲，取消下面整个 server 块的注释即可。
# ----------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name music.yourdomain.com;
#
#     # ACME HTTP-01 验证目录（certbot webroot 方式使用）
#     location /.well-known/acme-challenge/ {
#         root /var/www/letsencrypt;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

# ── HTTPS 主配置 ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music.yourdomain.com;

    # ── TLS 证书（Let's Encrypt） ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/music.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/music.yourdomain.com/chain.pem;

    # ── TLS 加固 ─────────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── 安全响应头 ───────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── 上传文件大小限制（匹配后端 500MB） ──────────────────────────────────
    client_max_body_size 512m;

    # ── 日志 ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/musicapp_access.log;
    error_log  /var/log/nginx/musicapp_error.log;

    # ── Service Worker（禁用缓存） ───────────────────────────────────────────
    location = /sw.js {
        proxy_pass http://musicapp_front;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── 后端 API（含音视频流） ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://musicapp_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 音视频流：关闭代理缓冲，支持 Range 请求和长连接
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_connect_timeout   15s;
    }

    # ── 前端（Next.js） ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://musicapp_front;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
